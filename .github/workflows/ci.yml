name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - name: Get pnpm store path
        id: pnpm-store
        run: echo "path=$(nix develop .#ci --command pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: Cache pnpm store
        uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-
      - run: nix develop .#ci --command pnpm install --frozen-lockfile
      # The tokenizer tests read tokenizer.json from the pinned model repo.
      - name: Fetch tokenizer.json
        run: |
          mkdir -p models/onnx
          curl -sfL -o models/onnx/tokenizer.json \
            https://huggingface.co/jbarlo/eyespy-models/resolve/7d55bf5697d2d229e72aef402ddbf921c3a74110/sam3/tokenizer.json
          echo "6d9109cc838977f3ca94a379eec36aecc7c807e1785cd729660ca2fc0171fb35  models/onnx/tokenizer.json" | sha256sum -c
      - run: nix develop .#ci --command pnpm verify
