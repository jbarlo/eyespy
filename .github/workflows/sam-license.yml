name: sam-license

# Compares third_party/sam3/LICENSE with the SAM License upstream. When the text changed, it opens (or updates) one
# pull request on the sam-license-update branch for the owner to review. A failed fetch fails the run. The hf job fails
# while the licence and notice copies on Hugging Face differ from main's, which the owner uploads by hand.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sam-license
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      - name: Compare with upstream
        id: check
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: nix develop .#ci --command node tools/licenses/sam-license.js --body "$RUNNER_TEMP/sam-license-pr.md"
      - name: Open or update the pull request
        if: steps.check.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: sam-license-update
          delete-branch: true
          title: "SAM License: the upstream text changed"
          body-path: ${{ runner.temp }}/sam-license-pr.md
          commit-message: "third_party/sam3: the SAM License text from upstream"
          author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          add-paths: |
            third_party/sam3/LICENSE
            third_party/sam3/NOTICE
            THIRD_PARTY.md

  hf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Compare with the copies on Hugging Face
        env:
          HF_REPO: jbarlo/eyespy-models
        run: |
          stale=0
          for pair in LICENSE:LICENSE-SAM.txt NOTICE:NOTICE-SAM.txt; do
            local=third_party/sam3/${pair%%:*} remote=sam3/${pair#*:}
            curl -fsSL "https://huggingface.co/$HF_REPO/resolve/main/$remote" -o "$RUNNER_TEMP/hf-copy"
            if ! cmp -s "$RUNNER_TEMP/hf-copy" "$local"; then
              echo "::error::$remote on $HF_REPO differs from $local. From a checkout of main, in the default devshell: hf upload $HF_REPO $local $remote"
              stale=1
            fi
          done
          exit $stale
