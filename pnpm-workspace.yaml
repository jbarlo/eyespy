packages:
  - cli
  - core
  - server
  - web
allowBuilds:
  esbuild: true
  # postinstall only downloads the CUDA and TensorRT EPs (an unhashed NuGet package). The WebGPU EP is in the npm
  # tarball.
  onnxruntime-node: false
  # postinstall is a no-op warning
  protobufjs: false
  sharp: true
catalog:
  "@trpc/client": ^11.19.0
  "@trpc/server": ^11.19.0
  "@types/node": ^22.20.5
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  knip: ^6.43.0
  neverthrow: ^8.2.0
  # keep both equal. A bump also changes the ORT wasm entry (sha256 and size) in the web manifest.
  onnxruntime-node: 1.30.0
  onnxruntime-web: 1.30.0
  react: ^19.3.1
  react-dom: ^19.3.1
  tsx: ^4.23.15
  # the newest minor that typescript-eslint supports
  typescript: ~5.9.3
  zod: ^4.6.7
  zustand: ^5.0.16
# neverthrow 8.x lists rollup's linux-x64 native binary as an optional dependency by mistake. Nothing uses it.
ignoredOptionalDependencies:
  - "@rollup/rollup-linux-x64-gnu"
